plugins { id 'net.fabricmc.fabric-loom' version '1.17.21' }
group = 'de.tobias30.claims'
version = '1.31.6'
base { archivesName = 'Claims-Client' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.162.0+26.3'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
jar { from('LICENSE.md') }
